name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 3.9 is the interpreter KiCad bundles on macOS and Windows.
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      # uv brings its own interpreter: the runners no longer carry 3.9.
      - uses: astral-sh/setup-uv@v6
      - run: uv venv --python ${{ matrix.python }} .venv
      - run: uv pip install --python .venv/bin/python pytest jsonschema certifi "kicad-python>=0.9.2"
      - run: uvx ruff check plugin tests tools
      - run: .venv/bin/python -m pytest -q
      # The real thing, read only: the default service over verified HTTPS.
      - run: .venv/bin/python -m pytest -q -m network

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: The tag is the package version
        run: |
          want="${GITHUB_REF_NAME#v}"
          have="$(python -c 'import json; print(json.load(open("pcm/metadata.json"))["versions"][0]["version"])')"
          test "$want" = "$have" || { echo "tag $want, metadata $have"; exit 1; }
      - run: python tools/build_package.py
      - name: Publish the archive and its metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --draft --title "$GITHUB_REF_NAME" \
            dist/*.zip dist/metadata.json dist/repository/packages.json dist/repository/repository.json
